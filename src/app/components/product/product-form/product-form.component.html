<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <input type="text" formControlName="nombre" placeholder="Nombre">
  <input type="text" formControlName="descripcion" placeholder="Descripción">
  <input type="number" formControlName="precio" placeholder="Precio">

  <select formControlName="idCategoria">
    <option value="">Selecciona categoría</option>
    <option *ngFor="let c of categorias" [value]="c.id">{{c.nombre}}</option>
  </select>

  <select formControlName="idSubcategoria">
    <option value="">Selecciona subcategoría</option>
    <option *ngFor="let s of subcategorias" [value]="s.id">{{s.nombre}}</option>
  </select>

  <select formControlName="idBranch">
    <option value="">Selecciona sucursal</option>
    <option *ngFor="let b of branches" [value]="b.id">{{b.nombre}}</option>
  </select>

  <select formControlName="idMaterial">
    <option value="">Selecciona material</option>
    <option *ngFor="let m of materiales" [value]="m.id">{{m.nombre}}</option>
  </select>

  <select formControlName="idMarca">
    <option value="">Selecciona marca</option>
    <option *ngFor="let m of marcas" [value]="m.id">{{m.nombre}}</option>
  </select>

  <div>
    <button type="submit">{{ product ? 'Actualizar' : 'Agregar' }}</button>
    <button type="button" (click)="onClose()">Cancelar</button>
  </div>
</form>
