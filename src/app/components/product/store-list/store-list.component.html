<div class="cont">
  <div *ngIf="cargando">Cargando tiendas...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="content-options">
    <input type="checkbox" class="none" id="checkbox-options_content" hidden>
    <div class="options-header">
      <h2>Tiendas</h2>
    </div>

    <div class="options-bar">
      <label class="btn empty btn-filter" for="checkbox-options_content">
        <svg>
          <use href="../icons/icon.svg#toggles-icon"></use>
        </svg>
        Filtros
      </label>
      <input type="text" placeholder="Buscar tienda..." />
      <button class="btn fill">
        <svg>
          <use href="../icons/icon.svg#plus-icon"></use>
        </svg>
        Agregar
      </button>
    </div>

    <div class="options-content">
      <div class="filters">
        <div class="content-filter">
          <label class="btn empty option-filter">
            Filtros
            <svg>
              <use href="../icons/icon.svg#bottom-icon"></use>
            </svg>
          </label>
          <div class="filter">
            <ul class="options-filter">
              <li>
                <label for="filter-activo">
                  <input type="checkbox" id="filter-activo" />
                  <span>Activas</span>
                </label>
              </li>
              <li>
                <label for="filter-inactivo">
                  <input type="checkbox" id="filter-inactivo" />
                  <span>Inactivas</span>
                </label>
              </li>
              <li>
                <label for="filter-lima">
                  <input type="checkbox" id="filter-lima" />
                  <span>Lima</span>
                </label>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <button class="btn empty">Filtrar</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Imagen</th>
          <th>Nombre</th>
          <th>Nombre Legal</th>
          <th>Dirección</th>
          <th>RUC</th>
          <th>Opciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let tienda of tiendas">
          <td>{{ tienda.id }}</td>
          <td>
            <img
              [src]="tienda.rutaImagen"
              alt="{{ tienda.nombre }}"
              class="img-preview"
            />
          </td>
          <td>{{ tienda.nombre }}</td>
          <td>{{ tienda.nombreLegal }}</td>
          <td>{{ tienda.direccion }}</td>
          <td>{{ tienda.ruc }}</td>
          
          <td class="acciones">
            <button>
              <svg>
                <use href="../icons/icon.svg#eyes-icon"></use>
              </svg>
            </button>
            <button>
              <svg>
                <use href="../icons/icon.svg#pencil-icon"></use>
              </svg>
            </button>
            <button>
              <svg>
                <use href="../icons/icon.svg#trash-icon"></use>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination">
      <button class="btn fill">+</button>
      <button class="btn empty">1</button>
      <button class="btn fill">-</button>
    </div>
  </div>
</div>
