<div class="table-container">
    <table>
        <thead>
            <tr>
                <th *ngFor="let col of columns">{{ col }}</th>
                <th>Opciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of data">
                <td *ngFor="let col of columns">{{ item[col.toLowerCase()] }}</td>
                <td class="acciones">
                    <button>
                        <svg>
                            <use href="../icons/icon.svg#eyes-icon"></use>
                        </svg>
                    </button>
                    @if (sePuedeEditar) {
                        <button>
                            <svg>
                                <use href="../icons/icon.svg#pencil-icon"></use>
                            </svg>
                        </button>
                    }
                    <button>
                        <svg>
                            <use href="../icons/icon.svg#trash-icon"></use>
                        </svg>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination" *ngIf="enablePagination">
        <button class="btn" [disabled]="currentPage === 0" (click)="goToPage(0)">Primera</button>
        <button class="btn" [disabled]="currentPage === 0" (click)="goToPage(currentPage - 1)">Anterior</button>
        <span>Página {{ currentPage + 1 }} de {{ totalPages }}</span>
        <button class="btn" [disabled]="currentPage + 1 >= totalPages"
            (click)="goToPage(currentPage + 1)">Siguiente</button>
        <button class="btn" [disabled]="currentPage + 1 >= totalPages"
            (click)="goToPage(totalPages - 1)">Última</button>
    </div>
</div>
