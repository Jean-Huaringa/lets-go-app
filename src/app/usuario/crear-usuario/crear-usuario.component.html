<h1>Crear Usuario</h1>

<form [formGroup]="form" (submit)="crearUsuario()">
  <div>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" formControlName="nombre" />
  </div>
  <div>
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" formControlName="apellido" />
  </div>
  <div>
    <label for="tipoDocumento">Tipo de Documento:</label>
    <input type="text" id="tipoDocumento" formControlName="tipoDocumento" />
  </div>
  <div>
    <label for="nmrDocumento">Número de Documento:</label>
    <input type="text" id="nmrDocumento" formControlName="nmrDocumento" />
  </div>
  <div>
    <label for="email">Email:</label>
    <input type="email" id="email" formControlName="email" />
  </div>
  <div>
    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" formControlName="telefono" />
  </div>
  <div>
    <label for="idRol">ID de Rol:</label>
    <input type="number" id="idRol" formControlName="idRol" />
  </div>
  <div>
    <label for="idPais">ID de País:</label>
    <input type="number" id="idPais" formControlName="idPais" />
  </div>
  <div>
    <label for="idDepartamento">ID de Departamento:</label>
    <input type="number" id="idDepartamento" formControlName="idDepartamento" />
  </div>
  <div>
    <label for="idProvincia">ID de Provincia:</label>
    <input type="number" id="idProvincia" formControlName="idProvincia" />
  </div>
  <div>
    <label for="idDistrito">ID de Distrito:</label>
    <input type="number" id="idDistrito" formControlName="idDistrito" />
  </div>
  <button type="submit">Crear Usuario</button>
</form>
