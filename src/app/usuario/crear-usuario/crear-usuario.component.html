<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-3">Crear usuario</h2>

          <form [formGroup]="form" (ngSubmit)="crearUsuario()" class="row g-3">
            <div class="col-md-6">
              <label for="nombre" class="form-label">Nombre</label>
              <input id="nombre" class="form-control" type="text" formControlName="nombre" />
            </div>

            <div class="col-md-6">
              <label for="apellido" class="form-label">Apellido</label>
              <input id="apellido" class="form-control" type="text" formControlName="apellido" />
            </div>

            <div class="col-md-4">
              <label for="tipoDocumento" class="form-label">Tipo de documento</label>
              <input id="tipoDocumento" class="form-control" type="text" formControlName="tipoDocumento" />
            </div>

            <div class="col-md-8">
              <label for="nmrDocumento" class="form-label">Número de documento</label>
              <input id="nmrDocumento" class="form-control" type="text" formControlName="nmrDocumento" />
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input id="email" class="form-control" type="email" formControlName="email" />
            </div>

            <div class="col-md-6">
              <label for="telefono" class="form-label">Teléfono</label>
              <input id="telefono" class="form-control" type="text" formControlName="telefono" />
            </div>

            <div class="col-md-4">
              <label for="idRol" class="form-label">Rol (ID)</label>
              <input id="idRol" class="form-control" type="number" formControlName="idRol" />
            </div>

            <div class="col-md-4">
              <label for="idPais" class="form-label">País (ID)</label>
              <input id="idPais" class="form-control" type="number" formControlName="idPais" />
            </div>

            <div class="col-md-4">
              <label for="idDepartamento" class="form-label">Departamento (ID)</label>
              <input id="idDepartamento" class="form-control" type="number" formControlName="idDepartamento" />
            </div>

            <div class="col-md-6">
              <label for="idProvincia" class="form-label">Provincia (ID)</label>
              <input id="idProvincia" class="form-control" type="number" formControlName="idProvincia" />
            </div>

            <div class="col-md-6">
              <label for="idDistrito" class="form-label">Distrito (ID)</label>
              <input id="idDistrito" class="form-control" type="number" formControlName="idDistrito" />
            </div>

            <div class="col-12 text-end mt-2">
              <button type="submit" class="btn btn-success">Crear usuario</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
